[project]
name = "bogdan2"
version = "0.1.0"
description = "Host side operation of the beam profiler."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Derek Chen", email = "derek.chen@mpsd.mpg.de" },
  { name = "Jadyn Zeng", email = "jadyn.zeng@mpsd.mpg.de" },
]
dependencies = [
  "matplotlib",
  "numpy",
  "picosdk",
  "pyserial",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
  "ty",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.basedpyright]
typeCheckingMode = "recommended"

allowedUntypedLibraries = [
  "picosdk.functions",
  "picosdk.ps2000a",
  "serial",
]

include = [
  "bogdan2",
  "examples",
]

stubPath = "typings"

[tool.ruff]
line-length = 79
src = ["host"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "D",
  "ANN",
  "PYI",
  "PLR",
  "PGH003",
]

preview = true
dummy-variable-rgx = "^_$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
